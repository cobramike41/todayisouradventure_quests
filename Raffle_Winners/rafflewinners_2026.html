<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raffle Winners 2026</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .virginia-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            margin-top: 20px;
        }

        .virginia-sign {
            max-width: 300px;
            height: auto;
        }

        .virginia-logo {
            max-width: 100px;
            height: auto;
        }

        .road-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .road-path {
            fill: none;
            stroke: #444; /* Dark grey road */
            stroke-width: 40;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .road-centerline {
            fill: none;
            stroke: #FFCE54; /* Yellow dashed line */
            stroke-width: 4;
            stroke-dasharray: 15, 15;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Adjust waypoints to act as links */
        .waypoint-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .waypoint-link:hover .icon-container {
            transform: scale(1.1);
        }

        /* Video Modal Styles */
        .video-modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .video-modal-content {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #ytplayer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-video-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .close-video-modal:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <header class="virginia-header">
        <img src="../assets/VirginiaSign.png" alt="Virginia is for Lovers" class="virginia-sign">
        <img src="../assets/logo_small.webp" alt="TIOA Logo" class="virginia-logo">
    </header>

    <main class="adventure-map">
        <!-- SVG road -->
        <svg class="road-svg" viewBox="0 0 100 800" preserveAspectRatio="none">
            <!-- Road Base -->
            <path class="road-path" d="M 50 0 C 80 150, 20 250, 50 400 C 80 550, 20 650, 50 800" />
            <!-- Center Line -->
            <path class="road-centerline" d="M 50 0 C 80 150, 20 250, 50 400 C 80 550, 20 650, 50 800" />
        </svg>

        <div class="waypoints">
            <!-- Waypoint 1: Roanoke/Salem -->
            <a href="https://youtu.be/5X2YtgAhfsA" target="_blank" class="waypoint-link">
                <div class="waypoint" style="top: 25%; left: 60%;">
                    <div class="icon-container">
                        <img src="../assets/city.svg" alt="Roanoke/Salem" class="icon" style="width: 48px; height: 48px;">
                    </div>
                    <span class="waypoint-label">Roanoke/Salem</span>
                </div>
            </a>

            <!-- Waypoint 2: Floyd -->
            <a href="https://youtu.be/lflxAWRd14I" target="_blank" class="waypoint-link">
                <div class="waypoint" style="top: 50%; left: 35%;">
                    <div class="icon-container">
                        <img src="../assets/town.svg" alt="Floyd" class="icon" style="width: 48px; height: 48px;">
                    </div>
                    <span class="waypoint-label">Floyd</span>
                </div>
            </a>

            <!-- Waypoint 3: New River Valley -->
            <a href="https://youtu.be/Dl7YLWQ3_aw" target="_blank" class="waypoint-link">
                <div class="waypoint" style="top: 75%; left: 55%;">
                    <div class="icon-container">
                        <img src="../assets/valley.svg" alt="New River Valley" class="icon" style="width: 48px; height: 48px;">
                    </div>
                    <span class="waypoint-label">New River Valley</span>
                </div>
            </a>
        </div>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal">
        <div class="video-modal-content">
            <span class="close-video-modal" onclick="closeVideoModal()">&times;</span>
            <div id="ytplayer"></div>
        </div>
    </div>

    <script>
        // Check if video has been played
        if (!localStorage.getItem('raffle_2026_video_played')) {
            // Mark as played
            localStorage.setItem('raffle_2026_video_played', 'true');

            // Show modal
            const modal = document.getElementById('videoModal');
            modal.style.display = 'flex';

            // Load YouTube IFrame API
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            if (firstScriptTag) {
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            } else {
                document.head.appendChild(tag);
            }
        }

        var player;
        function onYouTubeIframeAPIReady() {
            // Ensure modal is visible before creating player if we're supposed to play
            const modal = document.getElementById('videoModal');
            if (modal.style.display === 'flex') {
                player = new YT.Player('ytplayer', {
                    height: '100%',
                    width: '100%',
                    videoId: 'e_S6dq_RYQU', // Short ID
                    playerVars: {
                        'autoplay': 1,
                        'playsinline': 1
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        function onPlayerReady(event) {
            // Attempt to play automatically
            // Unmuted autoplay might be blocked by browsers, falling back to user interaction
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            // If video ends (State 0)
            if (event.data == YT.PlayerState.ENDED) {
                closeVideoModal();
            }
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            modal.style.display = 'none';
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
        }
    </script>
</body>
</html>
